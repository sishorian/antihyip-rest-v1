{% extends "base.html" %}

{% block content %}
  <h1 class="mt-2">Delete Question: {{ question.pk }}</h1>

  <p class="mt-3">
    <strong>Text:</strong> {{ question.text }}
  </p>

  <p class="mt-3">Are you sure you want to delete the question?</p>

  <form method="post" class="mt-3">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, delete</button>
  </form>
{% endblock %}
