{% extends "base_generic.html" %}

{% block content %}
  <h1>Test: Question {{ question_position }}/{{ total_questions }}</h1>
  <p>{{ question.text }}</p>

  <form action="" method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="submit" name="submit-previous" value="Previous">
    <input type="submit" name="submit-next" value="Next">
  </form>
{% endblock %}
