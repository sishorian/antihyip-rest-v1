{% extends "base_generic.html" %}

{% block content %}
  <h1>List of bad sites</h1>

  <p>
    Click on a <em>Name</em> to view the details.
  </p>

  <table class="table">
    <thead>
      <tr>
        <th>Name</th>
        <th>Type</th>
        <th>Domains</th>
      </tr>
    </thead>
    <tbody>
      {% for badsite in badsite_list %}
        <tr>
          <td>
            <a href="{{ badsite.get_absolute_url }}">{{ badsite.name }}</a>
          </td>
          <td>{{ badsite.bad_type }}</td>
          <td>{{ badsite.display_domains }}</td>
        </tr>
      {% empty %}
        <tr>
          <td>
            <strong>None found</strong>
          </td>
          <td>
            <strong>-</strong>
          </td>
          <td>
            <strong>-</strong>
          </td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
