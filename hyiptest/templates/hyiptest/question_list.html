{% extends "base.html" %}

{% block content %}
  <h1>Question List</h1>

  {% if question_list %}
    <ul>
      {% for question in question_list %}
        <li>
          <a href="{{ question.get_absolute_url }}">{{ question.text }}</a>
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p>No questions found in the database</p>
  {% endif %}
{% endblock %}
