{% extends "base.html" %}
{% load i18n %}

{% block content %}
  <h1 class="mt-2">{% translate "Question List" %}</h1>

  <ul class="mt-3">
    {% for question in question_list %}
      <li>
        <a href="{{ question.get_absolute_url }}">{{ question.text }}</a>
      </li>
    {% empty %}
      <li class="list-unstyled">{% translate "No questions found in the database" %}</li>
    {% endfor %}
  </ul>
{% endblock %}
