{% extends "base.html" %}
{% load i18n %}

{% block content %}
  <h1 class="mt-2">{% translate "Delete Test Progress" %}</h1>

  <p class="mt-3">
    <strong>ID:</strong> {{ htestprogress.id }}
  </p>

  <p class="mt-3">
    {% translate "Are you sure you want to delete the test progress?" %}
  </p>

  <form method="post" class="mt-3">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">{% translate "Yes, delete" %}</button>
  </form>
{% endblock %}
